name: code-editor
description: Inspects, reads, creates, and surgically patches source code files using exact string replacements.
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: Target absolute or relative file path.
    action:
      type: string
      enum:
        - view
        - create
        - replace
        - undo
      description: The file editing operation to perform.
    target_content:
      type: string
      description: Exact character sequence in the existing file to be replaced.
    replacement_content:
      type: string
      description: New content to substitute in place of target_content.
  required:
    - file_path
    - action
